<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — AFX Work Tracker</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b13;
        color: #f4f4f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 360px; }
      h1 { font-size: 1.25rem; margin-bottom: 8px; }
      p { color: #a5a5b5; font-size: 0.9rem; line-height: 1.5; }
      button {
        margin-top: 20px;
        background: #5048E5;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Can't reach the AFX Work Tracker right now. Check your connection and try again — nothing you've submitted is lost.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
